<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' app: data: blob:; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' app: data: blob:; media-src 'self' app: blob:; font-src 'self' app: data:; connect-src 'self' app: data: blob:">
  <title>SlaxxCUT</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="assets/logo.png" alt="" class="brand-logo">
      <span class="brand-name">Slaxx<b>CUT</b></span>
    </div>
    <div class="project-name"><span id="projName"></span><span id="dirtyDot" class="dirty-dot" data-tip-text="•"></span></div>
    <div class="topbar-right" id="topbarRight"></div>
  </header>

  <main class="workspace" id="workspace">
    <!-- LEFT: media / effects / transitions -->
    <section class="panel left-panel" id="leftPanel">
      <nav class="tabs" id="leftTabs">
        <button class="tab active" data-tab="media" data-tip="tip.tab.media"><span data-i18n="tab.media"></span></button>
        <button class="tab" data-tab="effects" data-tip="tip.tab.effects"><span data-i18n="tab.effects"></span></button>
        <button class="tab" data-tab="transitions" data-tip="tip.tab.transitions"><span data-i18n="tab.transitions"></span></button>
      </nav>
      <div class="tab-page active" data-page="media" id="pageMedia"></div>
      <div class="tab-page" data-page="effects" id="pageEffects"></div>
      <div class="tab-page" data-page="transitions" id="pageTransitions"></div>
      <aside class="inspector" id="inspector"></aside>
    </section>

    <!-- MIDDLE: source monitor -->
    <section class="panel monitor" id="sourceMonitor"></section>

    <!-- RIGHT: program monitor -->
    <section class="panel monitor program" id="programMonitor"></section>

    <!-- AUDIO MODE: audio editor (spans middle + right) -->
    <section class="panel monitor" id="audioEditor"></section>
  </main>

  <div class="hsplit" id="hsplit" title=""></div>

  <div class="toolbar" id="toolbar"></div>

  <section class="timeline" id="timeline"></section>

  <script src="../shared/core.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/textrender.js"></script>
  <script src="js/glrender.js"></script>
  <script src="js/playback.js"></script>
  <script src="js/edit.js"></script>
  <script src="js/media.js"></script>
  <script src="js/effectspanel.js"></script>
  <script src="js/monitors.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/inspector.js"></script>
  <script src="js/audioeditor.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/help.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
